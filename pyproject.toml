[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screener"
version = "0.1.0"
description = "AI resume screener: Claude API + MongoDB Atlas Vector Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "voyageai>=0.3",
    "pymongo>=4.8",
    "certifi>=2024.2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mongomock>=4.1"]

[project.scripts]
screener = "resume_screener.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/resume_screener/cli.py" = ["B008"]  # typer.Option defaults are the typer idiom
